[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scales-video-compressor"
version = "0.1.1"
description = "Compress videos to a target file size (2-pass x264) or target quality (CRF)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Video Compressor contributors" }]
keywords = ["video", "compress", "ffmpeg", "x264", "h264", "nvdec", "nvenc", "vaapi", "cli", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ronaldbvirinyangwe/video_compressor"
Repository = "https://github.com/ronaldbvirinyangwe/video_compressor"
Documentation = "https://ronaldbvirinyangwe.github.io/video_compressor"

[project.optional-dependencies]
web = ["flask>=2.2"]
dev = ["pytest>=7.0", "build>=1.0"]

[project.scripts]
video-compressor = "video_compressor.cli:main"

[tool.setuptools]
packages = ["video_compressor"]

[tool.setuptools.package-data]
video_compressor = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]